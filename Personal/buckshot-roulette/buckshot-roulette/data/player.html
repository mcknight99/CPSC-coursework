<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Player</title>

    <link rel="stylesheet" href="/style.css">

</head>

<body>

    <main>

        <h1>PLAYER</h1>

        <section>

            <label>
                <h3>Player number</h3>
                     <br>
                <!-- <select id="playerSelect"> -->
                    <!-- change this so that on page load we collect all available players
                     and that when there is a player that joins under a value then it gets removed-->
                     <!--maybe instead, use 8 radio buttons so just hide each button when taken and hide all buttons when joined-->
                    
                     <input type="radio" id="player1" name="playerSelect" value="1">
                     <label for="player1">Player 1</label>
                     <br>
                     <input type="radio" id="player2" name="playerSelect" value="2">
                     <label for="player2">Player 2</label>
                     <br>
                     <input type="radio" id="player3" name="playerSelect" value="3">
                     <label for="player3">Player 3</label>
                     <br>
                     <input type="radio" id="player4" name="playerSelect" value="4">
                     <label for="player4">Player 4</label>
                     <br>
                     <input type="radio" id="player5" name="playerSelect" value="5">
                     <label for="player5">Player 5</label>
                     <br>
                     <input type="radio" id="player6" name="playerSelect" value="6">
                     <label for="player6">Player 6</label>
                     <br>
                     <input type="radio" id="player7" name="playerSelect" value="7">
                     <label for="player7">Player 7</label>
                     <br>
                    <input type="radio" id="player8" name="playerSelect" value="8">
                    <label for="player8">Player 8</label>
                     <br>
                </select>
            </label>

            <button onclick="joinPlayer()" id="joinButton">
                JOIN
            </button>

        </section>


        <section id="playerPanel" hidden>

            <h2 id="playerName"></h2>

            <p>
                Health:
                <span id="health"></span>
            </p>

            <p id="turnStatus"></p>

            <h2>Items</h2>

            <div id="items"></div>

            <h2>Secret Information</h2>

            <div id="secret"></div>

        </section>

    </main>

    <script src="/app.js"></script>

</body>

</html>
